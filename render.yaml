services:
  - type: web
    name: hisaab-financial-digital-twin
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: HISAAB_HTTP_PORT
        value: "8080"
      - key: HISAAB_ENGINE_PORT
        value: "8081"
      - key: HISAAB_BIND
        value: "0.0.0.0"
      - key: HISAAB_RATE_LIMIT
        value: "60"
